# LOAD TEST ONLY — never deploy. Passes the client's X-Forwarded-For through so each simulated
# visitor gets its own rate-limit bucket. Production nginx (config/nginx.conf) overwrites the header.
server {
	listen 8081;
	server_name load.test;
	client_max_body_size 50m;
	location /assets {
		root /home/claude/frappe-bench/sites;
		try_files $uri =404;
		add_header Cache-Control "max-age=31536000";
	}
	location /files {
		root /home/claude/frappe-bench/sites/load.test/public;
		try_files $uri =404;
	}
	location / {
		proxy_pass http://frappe-bench-frappe;
		proxy_http_version 1.1;
		proxy_set_header Host load.test;
		proxy_set_header X-Frappe-Site-Name load.test;
		proxy_set_header X-Forwarded-For $http_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Use-X-Accel-Redirect True;
		proxy_read_timeout 120;
		proxy_redirect off;
	}
}
