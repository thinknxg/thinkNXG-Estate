[project]
name = "thinknxg_estate"
authors = [{ name = "Kreatao", email = "sales@kreatao.com" }]
description = "thinkNXG Estate: Property Management, Leasing and Real Estate CRM on thinkNXG ERP"
requires-python = ">=3.14"
readme = "README.md"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = []

[project.urls]
Homepage = "https://thinknxg.com/estate"
Documentation = "https://docs.thinknxg.com/thinknxgestate"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"
erpnext = ">=16.0.0-dev,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py314"
